<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IB English B Practice App — HL & SL (4 Skills)</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1a2030; --muted:#6b7280;
  --brand:#1f4ed8; --brand-2:#0ea5e9; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --line:#e5e7eb; --chip:#eef2ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55}
header{background:linear-gradient(135deg,#1f4ed8,#0ea5e9);color:#fff;padding:18px 24px;
  position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(0,0,0,.1)}
header h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.2px}
header .sub{font-size:.85rem;opacity:.92;margin-top:2px}
.user-pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.15);
  padding:4px 10px 4px 4px;border-radius:999px;font-size:.82rem;margin-left:8px}
.user-pill .avatar{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem}
.user-pill button{background:transparent;border:none;color:#fff;cursor:pointer;font-size:.85rem;
  padding:0 4px;opacity:.85}
.user-pill button:hover{opacity:1;text-decoration:underline}
.live-score{position:fixed;bottom:20px;right:20px;background:#fff;border:2px solid var(--brand);
  border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30;
  min-width:200px;font-size:.88rem}
.live-score .ls-title{font-weight:700;color:var(--brand);font-size:.78rem;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.live-score .ls-row{display:flex;justify-content:space-between;align-items:center;margin:3px 0}
.live-score .ls-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:6px}
.live-score .ls-bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:.3s}
.login-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:34px;max-width:440px;width:100%;
  box-shadow:0 12px 40px rgba(31,78,216,.15);text-align:center}
.login-card h2{margin:0 0 8px;color:var(--brand)}
.login-card .logo{font-size:3rem;margin-bottom:8px}
.login-card label{display:block;text-align:left;font-size:.85rem;font-weight:600;
  color:var(--ink);margin:14px 0 4px}
.login-card input{padding:10px 12px;font-size:1rem}
.admin-link{font-size:.78rem;color:var(--muted);margin-top:18px;cursor:pointer;
  text-decoration:underline;background:none;border:none}
.admin-link:hover{color:var(--brand)}
.attempts-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
.attempts-table th,.attempts-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.attempts-table th{background:#eef2ff;color:var(--brand);font-weight:600}
.attempts-table tr:hover td{background:#fafbff}
.attempts-table .badge-skill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.skill-reading{background:#dbeafe;color:#1e40af}
.skill-listening{background:#dcfce7;color:#166534}
.skill-writing{background:#fef3c7;color:#92400e}
.skill-speaking{background:#fce7f3;color:#9d174d}
.share-code-box{background:#f8fafc;border:2px dashed var(--brand);border-radius:8px;
  padding:14px;margin-top:10px;font-family:ui-monospace,monospace;font-size:.78rem;
  word-break:break-all;max-height:120px;overflow:auto;line-height:1.4}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat-card .stat-num{font-size:1.6rem;font-weight:700;color:var(--brand)}
.stat-card .stat-lbl{font-size:.78rem;color:var(--muted);margin-top:2px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer;
  transition:.15s}
nav button:hover{background:rgba(255,255,255,.22)}
nav button.active{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h2{margin:0 0 8px;font-size:1.1rem}
.card h3{margin:14px 0 6px;font-size:1rem;color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);color:var(--brand);font-size:.75rem;padding:3px 10px;border-radius:999px;font-weight:600}
.chip.sl{background:#fef3c7;color:#92400e}
.chip.hl{background:#dcfce7;color:#166534}
button.primary{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:.9rem}
button.primary:hover{background:#1942b2}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem}
button.ghost:hover{background:#eef2ff}
button.small{padding:5px 10px;font-size:.8rem}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.exam-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.exam-card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:0 6px 20px rgba(31,78,216,.08)}
.exam-card h3{margin:0;font-size:1rem;color:var(--ink)}
.exam-card .themes{font-size:.78rem;color:var(--muted)}
.skills-bar{display:flex;gap:4px;margin-top:6px}
.skills-bar span{font-size:.65rem;background:#f1f5f9;color:#475569;padding:2px 6px;border-radius:4px}
.text-block{background:#fafbff;border-left:3px solid var(--brand-2);padding:14px 16px;
  border-radius:6px;margin:10px 0;font-size:.95rem}
.text-block p{margin:0 0 8px}
.text-block p[data-line]::before{content:attr(data-line);display:inline-block;
  width:2.2em;color:var(--muted);font-size:.78rem;font-family:ui-monospace,monospace}
.q{padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q-num{font-weight:700;color:var(--brand);margin-right:8px}
.q-text{font-weight:500}
.q-options{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q-options label{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.92rem}
.q-options label:hover{background:#fafbff;border-color:var(--brand-2)}
.q-options input{margin-top:3px}
.q-options label.correct{background:#ecfdf5;border-color:var(--ok)}
.q-options label.wrong{background:#fef2f2;border-color:var(--err)}
input[type="text"],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;font-family:inherit;font-size:.95rem;background:#fff}
input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(31,78,216,.1)}
.input-correct{border-color:var(--ok)!important;background:#ecfdf5!important}
.input-wrong{border-color:var(--err)!important;background:#fef2f2!important}
.feedback{font-size:.85rem;margin-top:6px;padding:6px 10px;border-radius:6px}
.feedback.ok{background:#dcfce7;color:#14532d}
.feedback.err{background:#fee2e2;color:#7f1d1d}
.gap-input{display:inline-block;width:auto;min-width:60px;padding:3px 8px;font-size:.9rem}
.tf{display:flex;gap:14px;margin:6px 0}
.tf label{display:flex;align-items:center;gap:5px;cursor:pointer}
.timer{font-family:ui-monospace,monospace;font-size:1.05rem;font-weight:700;color:var(--brand);
  background:#eef2ff;padding:6px 12px;border-radius:8px}
.timer.warn{background:#fef3c7;color:#92400e}
.timer.danger{background:#fee2e2;color:#991b1b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.score-banner{padding:12px 16px;border-radius:10px;margin-bottom:12px;font-weight:600}
.score-banner.high{background:#dcfce7;color:#14532d;border:1px solid #86efac}
.score-banner.mid{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.score-banner.low{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5}
.tab-bar{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab-bar button{background:transparent;border:none;padding:10px 16px;cursor:pointer;
  font-size:.9rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-2px;white-space:nowrap}
.tab-bar button.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-bar button:hover:not(.active){color:var(--ink)}
.audio-controls{display:flex;gap:8px;align-items:center;background:#f8fafc;
  padding:12px;border-radius:8px;margin:10px 0;flex-wrap:wrap}
.audio-controls button{padding:6px 12px;border-radius:6px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:.85rem}
.audio-controls button:hover{background:#eef2ff;border-color:var(--brand)}
.audio-controls .play{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.audio-controls .play:hover{background:#1942b2}
.audio-controls select{width:auto;font-size:.85rem;padding:5px 8px}
.audio-status{font-size:.8rem;color:var(--muted)}
.word-counter{font-size:.85rem;color:var(--muted);margin-top:4px}
.word-counter.ok{color:var(--ok);font-weight:600}
.word-counter.over{color:var(--err);font-weight:600}
textarea.essay{min-height:300px;font-family:Georgia,serif;line-height:1.7;font-size:.95rem}
.rubric{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:14px;
  font-size:.88rem;margin:10px 0}
.rubric table{width:100%;border-collapse:collapse;margin-top:8px}
.rubric th,.rubric td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);
  vertical-align:top;font-size:.85rem}
.rubric th{background:#eef2ff;color:var(--brand);font-weight:600}
.self-assess{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  margin:6px 0;font-size:.9rem}
.self-assess input[type="range"]{width:160px}
.recording-area{background:#fef2f2;border:2px dashed #fca5a5;padding:14px;
  border-radius:10px;text-align:center}
.recording-area.active{background:#fee2e2;border-color:var(--err);animation:pulse 1.5s infinite}
.btn-record{background:var(--err);color:#fff;border:none;padding:10px 18px;
  border-radius:999px;cursor:pointer;font-weight:600}
.btn-record.recording{background:#7f1d1d}
.literary-extract{background:#fffbeb;border:1px solid #fde68a;padding:14px;border-radius:8px;
  font-family:Georgia,serif;font-style:italic;margin:8px 0}
.visual-stimulus{background:#eef2ff;border:1px solid #c7d2fe;padding:20px;border-radius:8px;
  text-align:center;margin:8px 0}
.visual-stimulus .icon{font-size:3rem;margin-bottom:8px}
.visual-stimulus .caption{font-weight:600;color:var(--brand);margin-bottom:4px}
.visual-stimulus .desc{font-size:.85rem;color:var(--muted)}
.show-answer{cursor:pointer;color:var(--brand);font-size:.85rem;font-weight:600;
  background:none;border:none;padding:4px 0;text-decoration:underline}
.answer-box{background:#ecfdf5;border-left:3px solid var(--ok);padding:8px 12px;
  margin-top:6px;font-size:.88rem;border-radius:4px;display:none}
.answer-box.shown{display:block}
.progress-mini{display:flex;gap:3px;margin-top:6px}
.progress-mini span{flex:1;height:4px;background:#e5e7eb;border-radius:2px}
.progress-mini span.done{background:var(--ok)}
hr.section-break{border:none;border-top:1px dashed var(--line);margin:20px 0}
.notes-area{margin-top:10px}
.notes-area textarea{min-height:80px;font-size:.85rem;background:#fffef0}
.themes-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.theme-tag{background:#eef2ff;color:var(--brand);font-size:.7rem;padding:2px 8px;border-radius:4px;font-weight:500}
@media (max-width:640px){
  main{padding:10px}
  .card{padding:14px}
  header h1{font-size:1.05rem}
  nav button{font-size:.78rem;padding:5px 10px}
}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
    <div>
      <h1>IB English B Practice App</h1>
      <div class="sub">Higher Level &amp; Standard Level — Reading · Writing · Listening · Speaking</div>
    </div>
    <div id="userArea"></div>
  </div>
  <nav id="mainNav">
    <button data-view="home" class="active">Home</button>
    <button data-view="exams">Exam Bank</button>
    <button data-view="results">My Results</button>
    <button data-view="resources">Resources</button>
    <button data-view="about">About</button>
  </nav>
</header>
<main id="app"></main>

<script>
/* ==========================================================
   IB ENGLISH B PRACTICE BANK
   Original practice materials inspired by the official format
   (4 full exams, mix of HL and SL, all 4 skills)
   ========================================================== */
const EXAMS = [];

/* ============== EXAM 1 — HL — Sharing the Planet / Human Ingenuity ============== */
EXAMS.push({
  id: 1, level: "HL",
  title: "Practice Exam 1 — HL",
  themes: ["Sharing the Planet", "Human Ingenuity"],
  reading: {
    timeLimit: 60, totalMarks: 40,
    texts: [
      {
        id: "A",
        title: "Why Cities Are Going Vertical: The Quiet Rise of Urban Farms",
        paragraphs: [
          {n:1, text:"Tucked between concrete towers in Singapore, Tokyo and New York, a quiet revolution is reshaping the way urbanites eat. Vertical farms — multi-storey indoor facilities where lettuce, herbs and even strawberries grow under pink LED lights — are no longer experiments. Today, they supply some of the freshest produce in the world's most crowded cities."},
          {n:2, text:"What Makes Vertical Farms Different? Unlike traditional farming, these operations use 95% less water by recirculating it in a closed system. They use no pesticides, because pests cannot reach the sealed grow rooms. Crops are stacked in trays, often 12 levels high, multiplying the yield per square metre dozens of times over."},
          {n:3, text:"The benefits go further. Because the produce is grown next to the consumer, it travels only a few kilometres rather than thousands. This drastically reduces emissions from transport. Some farms report harvesting in the morning and delivering to restaurants by lunchtime — a freshness conventional supply chains cannot match."},
          {n:4, text:"Yet the model is not without critics. Vertical farms consume large amounts of electricity for lighting and climate control. If that energy comes from coal, the environmental gain may be cancelled out. Companies are now racing to install solar panels and partner with renewable providers. As one founder put it: \"a vertical farm is only as green as its grid.\""},
          {n:5, text:"Crucially, these farms create jobs in unexpected places. Former warehouse workers, software engineers and biologists collaborate side by side. Cities once dependent on imports are now exporting know-how to drier regions struggling with food security. The vegetables on your plate, in short, may have grown next door — and that changes everything."}
        ],
        questions: [
          {id:1,type:"short",q:"In which three cities mentioned in paragraph 1 are vertical farms operating?",answer:"Singapore, Tokyo and New York",accept:["Singapore Tokyo New York","Singapore, Tokyo, New York"],marks:1},
          {id:2,type:"mcq",q:"According to paragraph 2, vertical farms…",options:["A. use more water than traditional farms.","B. cannot grow fruit such as strawberries.","C. recycle nearly all the water they use.","D. require chemical pesticides to control pests."],answer:"C",marks:1},
          {id:3,type:"mcq",q:"Why does the produce travel less distance?",options:["A. Because trucks are now electric.","B. Because the farms are inside cities.","C. Because trains carry the food faster.","D. Because the harvest is smaller."],answer:"B",marks:1},
          {id:4,type:"short",q:"What environmental risk is mentioned in paragraph 4 if vertical farms use electricity from coal?",answer:"the environmental gain may be cancelled out",accept:["the environmental gain is cancelled out","environmental gain cancelled out"],marks:1},
          {id:5,type:"tf",q:"Vertical farms cannot avoid the use of pesticides.",answer:"False",justification:"They use no pesticides, because pests cannot reach the sealed grow rooms",marks:1},
          {id:6,type:"tf",q:"Vertical farms can deliver food to restaurants on the same day it is harvested.",answer:"True",justification:"harvesting in the morning and delivering to restaurants by lunchtime",marks:1},
          {id:7,type:"tf",q:"Cities that import food cannot benefit from vertical farming.",answer:"False",justification:"Cities once dependent on imports are now exporting know-how",marks:1},
          {id:8,type:"vocab",q:"the buying and selling chain that brings food to consumers (paragraph 3)",answer:"supply chains",options:[],marks:1},
          {id:9,type:"vocab",q:"completely sealed (paragraph 2)",answer:"closed",marks:1},
          {id:10,type:"vocab",q:"making something many times bigger (paragraph 2)",answer:"multiplying",marks:1},
          {id:11,type:"ref",q:"\"that\" (paragraph 5, last sentence) refers to…",answer:"the vegetables on your plate / the fact that vegetables grew next door",accept:["the vegetables grew next door","vegetables grew next door","the vegetables grew nearby"],marks:1},
          {id:12,type:"ref",q:"\"its grid\" (paragraph 4) refers to…",answer:"a vertical farm",accept:["the vertical farm","the farm's electricity grid","the farm"],marks:1}
        ]
      },
      {
        id: "B",
        title: "From a memoir: Returning Home",
        paragraphs: [
          {n:1, text:"The first thing I noticed when I returned to my grandmother's village after eleven years was how small the streets had become. As a child, I remembered them as enormous — long, dusty corridors where I could chase chickens for what seemed like an entire afternoon. Now, walking down the main road took less than four minutes."},
          {n:2, text:"I had been warned about this. \"Distances shrink as you grow,\" my mother used to say with a soft smile, \"and so do the people you remember.\" I had laughed at her then. I did not laugh now."},
          {n:3, text:"My grandmother stood at the door of the same blue house, leaning on a stick I had never seen before. She was thinner. Her eyes, however, were exactly as I had left them — bright, mischievous, slightly impatient — and they searched my face with a curiosity that felt nearly impolite."},
          {n:4, text:"\"You took your time,\" she said in our language, the one I no longer dreamed in. I could not answer. The streets had been small, but the words I needed were even smaller; they had shrunk while I was abroad, and I was not sure I could grow them back."},
          {n:5, text:"That afternoon she fed me bread soup. It tasted of childhood and of a place I had decided to leave. I ate two bowls. Outside, a chicken — perhaps the descendant of the ones I once chased — wandered past the door without urgency, as if it, too, had forgotten me."}
        ],
        questions: [
          {id:13,type:"short",q:"What did the narrator notice first about the village (paragraph 1)?",answer:"how small the streets had become",accept:["the streets had become small","streets were small"],marks:1},
          {id:14,type:"mcq",q:"As a child, the narrator's main activity in the village was…",options:["A. cooking traditional dishes.","B. running after chickens.","C. visiting his grandmother daily.","D. helping in the family business."],answer:"B",marks:1},
          {id:15,type:"ref",q:"\"them\" (paragraph 2, first quotation) refers to…",answer:"distances",accept:["the distances","both distances and people"],marks:1},
          {id:16,type:"ref",q:"\"the ones I once chased\" (paragraph 5) refers to…",answer:"chickens",accept:["the chickens"],marks:1},
          {id:17,type:"tf",q:"The grandmother was using a stick that the narrator had seen before.",answer:"False",justification:"leaning on a stick I had never seen before",marks:1},
          {id:18,type:"tf",q:"The narrator still dreams in his grandmother's language.",answer:"False",justification:"the one I no longer dreamed in",marks:1},
          {id:19,type:"tf",q:"The narrator felt he had completely forgotten his native language.",answer:"False",justification:"I was not sure I could grow them back",marks:1},
          {id:20,type:"short",q:"Find a phrase in paragraph 5 that suggests a strong link with the past.",answer:"It tasted of childhood",accept:["tasted of childhood","of childhood"],marks:1},
          {id:21,type:"vocab-match",q:"Match the words to their meaning in the text",pairs:[
            {word:"enormous (¶1)", letter:"D"},
            {word:"mischievous (¶3)", letter:"A"},
            {word:"urgency (¶5)", letter:"E"}
          ],options:["A. playful","B. honest","C. expensive","D. extremely large","E. hurry","F. silence"],marks:3}
        ]
      },
      {
        id: "C",
        title: "Algorithms in our Pockets: Are We Still Choosing What We Watch?",
        paragraphs: [
          {n:1, text:"Every time you open a streaming app, an invisible engine begins working. It compares your viewing history to the choices of millions of strangers, predicts what you might enjoy, and rearranges the homepage accordingly. By the time the app has finished loading, you are no longer browsing a library — you are browsing a personalised reflection of your own past behaviour."},
          {n:2, text:"This is, on the surface, convenient. Recommendation algorithms save us from the exhausting task of choosing among thousands of films we will never watch. But the convenience comes at a cost. Researchers at the University of Amsterdam recently found that frequent users of recommendation systems are 38% less likely to discover content outside their existing tastes than users of curated platforms. We are, in other words, watching narrower lives than we used to."},
          {n:3, text:"There is also a question of who benefits. Algorithms are not neutral; they are written to maximise engagement, which is not the same as satisfaction. A user who watches three episodes of a mediocre series in a row may be more profitable than one who watches a single great film and goes to bed happy. The system favours the former. The viewer, often, does not notice."},
          {n:4, text:"Some companies are responding to criticism. Several European platforms now offer an \"explore\" mode that deliberately shows content unrelated to past viewing. Other services let users adjust the strength of personalisation. Whether these features are widely used is another matter — most viewers, surveys show, prefer the easy path."},
          {n:5, text:"The deeper concern is cultural. If everyone receives a different homepage, shared cultural references become harder to build. We may all be watching, but we are no longer watching together. Reclaiming a sense of shared discovery, perhaps even a sense of mild boredom, may be one of the most subversive acts a viewer can perform today."}
        ],
        questions: [
          {id:22,type:"mcq",q:"What does the algorithm do every time you open the app?",options:["A. It deletes your viewing history.","B. It compares your habits with other users.","C. It hides films you might enjoy.","D. It contacts the customer service team."],answer:"B",marks:1},
          {id:23,type:"short",q:"According to paragraph 2, by what percentage are frequent algorithm users less likely to discover new content?",answer:"38%",accept:["38 percent","38"],marks:1},
          {id:24,type:"mcq",q:"What does the writer mean by \"narrower lives\" (paragraph 2)?",options:["A. Lives that involve less travel.","B. Lives with fewer cultural experiences.","C. Lives spent in smaller homes.","D. Lives without internet access."],answer:"B",marks:1},

          {n:1,text:"The phrase \"artificial intelligence\" was coined in 1956, in a small academic conference at Dartmouth. The men who chose it were trying to be modest, even diplomatic. They knew that what they were describing was not yet intelligent in any meaningful sense. The adjective \"artificial\" was meant as a placeholder. Seventy years later, we are still using it — and the word may now be doing more harm than good."},

<script>
/* =========================================================================
   APP LOGIC
   ========================================================================= */
const app = document.getElementById('app');
const nav = document.getElementById('mainNav');
const userArea = document.getElementById('userArea');

/* === Admin password — Renatto can change this string before sharing === */
const ADMIN_PASSWORD = "renatto2026";

let state = {
  view: 'home',
  examId: null,
  skill: null,
  user: null,        // {name, email, since}
  isAdmin: false,
  answers: {},  // {examId: {skill: {qid: value}}}
  graded: {},   // {examId-skill: bool}
  attempts: [], // [{date, name, email, examId, skill, earned, total, pct}]
  liveCorrect: 0, liveTotal: 0,
  timer: null,
  timerSec: 0,
  ttsRate: 1.0,
  recording: false,
  recordSec: 0,
  recordTimer: null
};

/* ---------- Persistence ---------- */
const STORAGE_KEY = 'ibEnglishBApp_v2';
function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if(saved.answers) state.answers = saved.answers;
    if(saved.graded) state.graded = saved.graded;
    if(saved.user) state.user = saved.user;
    if(saved.attempts) state.attempts = saved.attempts;
  }catch(e){}
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    answers: state.answers, graded: state.graded,
    user: state.user, attempts: state.attempts
  }));
}
loadState();

/* ---------- User session ---------- */
function paintUserArea(){
  if(!state.user){
    userArea.innerHTML = '';
    return;
  }
  const initial = (state.user.name||'?').charAt(0).toUpperCase();
  userArea.innerHTML = `
    <div class="user-pill">
      <div class="avatar">${initial}</div>
      <span>${escHtml(state.user.name)}${state.isAdmin ? ' 🔐' : ''}</span>
      <button id="logoutBtn" title="Log out">Log out</button>
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', () => {
    if(confirm('Log out? Your progress will stay saved on this device.')){
      state.user = null; state.isAdmin = false; saveState();
      paintUserArea(); state.view = 'home'; render();
    }
  });
}

function loginAs(name, email){
  state.user = { name: name.trim(), email: email.trim().toLowerCase(), since: new Date().toISOString() };
  saveState(); paintUserArea();
}

function recordAttempt(examId, skill, earned, total){
  if(!state.user) return;
  const ex = EXAMS.find(e => e.id === examId);
  state.attempts.push({
    date: new Date().toISOString(),
    name: state.user.name, email: state.user.email,
    examId, examTitle: ex ? ex.title : '?', level: ex ? ex.level : '?',
    skill, earned, total, pct: total ? Math.round(earned/total*100) : 0
  });
  saveState();
}

/* ---------- Helpers ---------- */
function getAns(examId, skill){
  state.answers[examId] = state.answers[examId] || {};
  state.answers[examId][skill] = state.answers[examId][skill] || {};
  return state.answers[examId][skill];
}
function setAns(examId, skill, qid, val){
  getAns(examId, skill)[qid] = val;
  saveState();
}
function normalize(s){
  return String(s||'').toLowerCase().trim().replace(/[.,;:!?'"`]/g,'').replace(/\s+/g,' ');
}
function checkAnswer(q, given){
  const g = normalize(given);
  if(!g) return false;
  const accepts = [normalize(q.answer)];
  if(Array.isArray(q.accept)) q.accept.forEach(a => accepts.push(normalize(a)));
  return accepts.some(a => a === g || (a.length > 4 && (g.includes(a) || a.includes(g))));
}
function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function startTimer(seconds, onEnd){
  stopTimer();
  state.timerSec = seconds;
  const tick = () => {
    state.timerSec--;
    const el = document.getElementById('timerDisplay');
    if(el){
      el.textContent = fmtTime(state.timerSec);
      el.className = 'timer' + (state.timerSec < 60 ? ' danger' : state.timerSec < 300 ? ' warn' : '');
    }
    if(state.timerSec <= 0){
      stopTimer();
      if(onEnd) onEnd();
    }
  };
  state.timer = setInterval(tick, 1000);
}
function stopTimer(){
  if(state.timer){ clearInterval(state.timer); state.timer = null; }
}

/* ---------- Navigation ---------- */
nav.addEventListener('click', e => {
  if(e.target.tagName === 'BUTTON'){
    const view = e.target.dataset.view;
    if(view){
      state.view = view; state.examId = null; state.skill = null;
      stopTimer(); stopTTS();
      [...nav.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === e.target));
      render();
    }
  }
});

/* ---------- Views ---------- */
function render(){
  // Gate behind login (except About)
  if(!state.user && state.view !== 'about'){
    renderLogin();
    window.scrollTo(0,0);
    return;
  }
  paintUserArea();
  if(state.view === 'home') renderHome();
  else if(state.view === 'exams') renderExamBank();
  else if(state.view === 'results') renderResults();
  else if(state.view === 'resources') renderResources();
  else if(state.view === 'about') renderAbout();
  else if(state.view === 'exam') renderExamDetail();
  else if(state.view === 'skill') renderSkill();
  else if(state.view === 'admin') renderAdmin();
  window.scrollTo(0,0);
  // Remove live score widget if not in skill view
  const ls = document.getElementById('liveScore');
  if(ls && state.view !== 'skill') ls.remove();
}

/* ============= LOGIN ============= */
function renderLogin(){
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="logo">📘</div>
        <h2>Welcome!</h2>
        <p style="color:var(--muted);font-size:.92rem">Enter your name and email to start practising. Your progress is saved on this device and you can share your results with your teacher when you're done.</p>
        <form id="loginForm" style="margin-top:14px">
          <label for="nameInput">Full name</label>
          <input id="nameInput" type="text" required minlength="2" placeholder="e.g. Maria Pérez" autocomplete="name">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" required placeholder="you@example.com" autocomplete="email">
          <button type="submit" class="primary" style="margin-top:18px;width:100%">Start practising →</button>
        </form>
        <button class="admin-link" id="adminLoginLink">🔐 Teacher / admin access</button>
      </div>
    </div>
  `;
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    if(name.length < 2 || !email.includes('@')) return alert('Please enter a valid name and email.');
    loginAs(name, email);
    state.view = 'home';
    [...nav.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.view === 'home'));
    render();
  });
  document.getElementById('adminLoginLink').addEventListener('click', () => {
    const pwd = prompt('Enter admin password:');
    if(pwd === ADMIN_PASSWORD){
      state.user = { name: 'Admin', email: 'admin@local', since: new Date().toISOString() };
      state.isAdmin = true; saveState();
      state.view = 'admin'; render();
    } else if(pwd !== null){
      alert('Wrong password.');
    }
  });
}

function renderHome(){
  const totalScore = computeTotalProgress();
  app.innerHTML = `
    <div class="card">
      <h2>Welcome, Renatto 👋</h2>
      <p>This is your personal practice app for IB English B — Higher Level and Standard Level. It contains <strong>${EXAMS.length} full practice exams</strong> covering all four skills: <strong>Reading, Writing, Listening and Speaking</strong>. All texts and questions are <em>original materials</em> inspired by the official format. Use them as warm-ups, mock tests, or revision sessions.</p>
      <div class="row" style="margin-top:14px">
        <button class="primary" data-go="exams">Go to exam bank →</button>
        <button class="ghost" data-go="resources">More practice resources</button>
      </div>
    </div>

    <div class="card">
      <h2>Your progress</h2>
      <p style="color:var(--muted);font-size:.9rem">${totalScore.completed} / ${totalScore.total} sections completed</p>
      <div style="background:#e5e7eb;height:10px;border-radius:5px;overflow:hidden;margin-top:6px">
        <div style="background:var(--brand);height:100%;width:${totalScore.total ? (totalScore.completed/totalScore.total*100) : 0}%;transition:.3s"></div>
      </div>
      <div style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
        ${EXAMS.map(ex => `
          <div style="background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px">
            <div style="font-weight:600;font-size:.88rem">${ex.title}</div>
            <span class="chip ${ex.level.toLowerCase()}">${ex.level}</span>
            <div class="progress-mini">
              ${['reading','listening','writing','speaking'].map(s => `<span class="${state.graded[ex.id+'-'+s] ? 'done' : ''}"></span>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Quick start: 4 skills</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px">
        ${[
          {icon:'📖',name:'Reading',desc:'3 texts + 25–40 questions',color:'#1f4ed8'},
          {icon:'✍️',name:'Writing',desc:'Choose 1 of 3 prompts',color:'#0ea5e9'},
          {icon:'🎧',name:'Listening',desc:'3 audio passages (TTS)',color:'#16a34a'},
          {icon:'🎤',name:'Speaking',desc:'Visual or literary stimulus',color:'#d97706'},
        ].map(s => `
          <div style="background:linear-gradient(135deg,${s.color}11,${s.color}22);border:1px solid ${s.color}44;border-radius:10px;padding:14px">
            <div style="font-size:1.6rem">${s.icon}</div>
            <div style="font-weight:700;color:${s.color};margin-top:4px">${s.name}</div>
            <div style="font-size:.82rem;color:var(--muted);margin-top:2px">${s.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.go;
    [...nav.querySelectorAll('button')].forEach(n => n.classList.toggle('active', n.dataset.view === state.view));
    render();
  }));
}

function computeTotalProgress(){
  let completed = 0, total = EXAMS.length * 4;
  EXAMS.forEach(ex => {
    ['reading','listening','writing','speaking'].forEach(s => {
      if(state.graded[ex.id+'-'+s]) completed++;
    });
  });
  return {completed, total};
}

function renderExamBank(){
  app.innerHTML = `
    <div class="card">
      <h2>Exam Bank</h2>
      <p style="color:var(--muted);font-size:.92rem">Select an exam below. Each exam contains four skill sections: Reading, Writing, Listening and Speaking. You can take them in any order.</p>
      <div class="row" style="margin-top:10px">
        <select id="filterLevel" style="width:auto;font-size:.85rem">
          <option value="all">All levels</option>
          <option value="HL">HL only</option>
          <option value="SL">SL only</option>
        </select>
        <button class="ghost small" id="resetAll">Reset all progress</button>
      </div>
      <div id="examGrid" class="exam-grid" style="margin-top:14px"></div>
    </div>
  `;
  const grid = document.getElementById('examGrid');
  const filter = document.getElementById('filterLevel');
  function paint(){
    const lvl = filter.value;
    grid.innerHTML = EXAMS.filter(e => lvl === 'all' || e.level === lvl).map(ex => {
      const skills = ['reading','listening','writing','speaking'];
      const done = skills.filter(s => state.graded[ex.id+'-'+s]).length;
      return `
        <div class="exam-card" data-exam="${ex.id}">
          <div class="row" style="justify-content:space-between"><h3>${ex.title}</h3><span class="chip ${ex.level.toLowerCase()}">${ex.level}</span></div>
          <div class="themes">${ex.themes.join(' · ')}</div>
          <div style="font-size:.78rem;color:var(--muted)">Progress: ${done}/4 skills</div>
          <div class="progress-mini">${skills.map(s => `<span class="${state.graded[ex.id+'-'+s] ? 'done' : ''}"></span>`).join('')}</div>
          <div class="skills-bar"><span>📖 Reading</span><span>✍️ Writing</span><span>🎧 Listening</span><span>🎤 Speaking</span></div>
        </div>
      `;
    }).join('');
    grid.querySelectorAll('.exam-card').forEach(c => {
      c.addEventListener('click', () => {
        state.view = 'exam'; state.examId = parseInt(c.dataset.exam);
        render();
      });
    });
  }
  filter.addEventListener('change', paint);
  document.getElementById('resetAll').addEventListener('click', () => {
    if(confirm('Reset all progress and saved answers?')){
      state.answers = {}; state.graded = {}; saveState(); paint();
    }
  });
  paint();
}

function renderExamDetail(){
  const ex = EXAMS.find(e => e.id === state.examId);
  if(!ex){ state.view = 'exams'; return render(); }
  const skills = [
    {key:'reading',icon:'📖',name:'Reading Comprehension',time:`${ex.reading.timeLimit} min`,marks:`${ex.reading.totalMarks} marks`,desc:'3 texts with multiple question types'},
    {key:'listening',icon:'🎧',name:'Listening Comprehension',time:`${ex.listening.timeLimit} min`,marks:`${ex.listening.totalMarks} marks`,desc:'3 audio passages (text-to-speech)'},
    {key:'writing',icon:'✍️',name:'Writing — Productive skills',time:`${ex.writing.timeLimit} min`,marks:`${ex.writing.totalMarks} marks`,desc:'Choose 1 of 3 prompts'},
    {key:'speaking',icon:'🎤',name:'Speaking — Individual Oral',time:`${ex.speaking.timeLimit} min prep`,marks:`${ex.speaking.totalMarks} marks`,desc:ex.level === 'HL' ? 'Literary extract + discussion' : 'Visual stimulus + discussion'}
  ];
  app.innerHTML = `
    <div class="card">
      <button class="ghost small" id="backBtn">← Back to exam bank</button>
      <h2 style="margin-top:10px">${ex.title} <span class="chip ${ex.level.toLowerCase()}">${ex.level}</span></h2>
      <div class="themes-row">${ex.themes.map(t => `<span class="theme-tag">${t}</span>`).join('')}</div>
      <p style="color:var(--muted);font-size:.92rem">Choose a skill to start.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px">
        ${skills.map(s => {
          const done = state.graded[ex.id+'-'+s.key];
          return `
            <button data-skill="${s.key}" style="text-align:left;background:${done ? '#ecfdf5' : '#fff'};border:2px solid ${done ? '#86efac' : 'var(--line)'};border-radius:12px;padding:16px;cursor:pointer;transition:.15s;font-family:inherit;color:inherit">
              <div style="font-size:1.8rem">${s.icon}</div>
              <div style="font-weight:700;color:var(--brand);margin-top:6px">${s.name}</div>
              <div style="font-size:.82rem;color:var(--muted);margin-top:4px">${s.desc}</div>
              <div style="display:flex;gap:6px;margin-top:8px;font-size:.75rem">
                <span class="chip">${s.time}</span><span class="chip">${s.marks}</span>${done ? '<span class="chip" style="background:#dcfce7;color:#166534">✓ Done</span>' : ''}
              </div>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => {
    state.view = 'exams'; state.examId = null; render();
  });
  app.querySelectorAll('[data-skill]').forEach(b => b.addEventListener('click', () => {
    state.skill = b.dataset.skill; state.view = 'skill'; render();
  }));
}

/* ---------- Skill rendering dispatcher ---------- */
function renderSkill(){
  const ex = EXAMS.find(e => e.id === state.examId);
  if(!ex){ state.view = 'exams'; return render(); }
  if(state.skill === 'reading') renderReading(ex);
  else if(state.skill === 'listening') renderListening(ex);
  else if(state.skill === 'writing') renderWriting(ex);
  else if(state.skill === 'speaking') renderSpeaking(ex);
}

/* ============= READING ============= */
function renderReading(ex){

function renderTextSection(t, ti, examId){
  return `
    <div class="card">
      <h2>Text ${t.id} — ${t.title}</h2>
      <div class="text-block">
        ${t.paragraphs.map((p,i) => `<p data-line="${p.n||i+1}">${p.text}</p>`).join('')}
      </div>

      <div class="qList">${t.questions.map(q => renderQuestion(q, examId, 'reading')).join('')}</div>
    </div>
  `;

function renderQuestion(q, examId, skill){
  const ans = getAns(examId, skill);
  const v = ans[q.id] || '';
  const marks = q.marks ? `<span class="chip" style="font-size:.65rem">${q.marks} mark${q.marks>1?'s':''}</span>` : '';
  let body = '';
  if(q.type === 'short'){
    body = `<input type="text" data-qid="${q.id}" value="${escAttr(v)}" placeholder="Your answer">`;
  } else if(q.type === 'mcq'){
    body = `<div class="q-options">${q.options.map(o => {
      const letter = o.match(/^([A-D])/)[1];
      const checked = v === letter ? 'checked' : '';
      return `<label><input type="radio" name="q${q.id}" data-qid="${q.id}" value="${letter}" ${checked}> ${escHtml(o)}</label>`;
    }).join('')}</div>`;
  } else if(q.type === 'tf'){
    body = `<div class="tf">
      <label><input type="radio" name="q${q.id}" data-qid="${q.id}" value="True" ${v==='True'?'checked':''}> True</label>
      <label><input type="radio" name="q${q.id}" data-qid="${q.id}" value="False" ${v==='False'?'checked':''}> False</label>
    </div>`;
    if(q.justification){
      body += `<div style="font-size:.85rem;color:var(--muted);margin-top:4px">Justification (optional): <input type="text" data-qid="${q.id}-just" value="${escAttr(ans[q.id+'-just']||'')}" placeholder="Words from text"></div>`;
    }
  } else if(q.type === 'vocab'){
    body = `<input type="text" data-qid="${q.id}" value="${escAttr(v)}" placeholder="Word or phrase from the text">`;
  } else if(q.type === 'ref'){
    body = `<input type="text" data-qid="${q.id}" value="${escAttr(v)}" placeholder="What does it refer to?">`;
  } else if(q.type === 'gapfill'){
    let txt = q.text;
    q.gaps.forEach(g => {
      const gv = ans[q.id+'-'+g.id] || '';
      txt = txt.replace('['+g.id+']', `<select data-qid="${q.id}-${g.id}" style="width:auto;display:inline-block;font-size:.85rem;padding:3px 6px"><option value="">— pick —</option>${q.options.map(o => `<option value="${o.l}" ${gv===o.l?'selected':''}>${o.l}. ${o.w}</option>`).join('')}</select>`);
    });
    body = `<div style="background:#fafbff;padding:10px;border-radius:6px;margin:6px 0">${txt}</div>
      <div style="font-size:.8rem;color:var(--muted)">Word bank: ${q.options.map(o => `<strong>${o.l}.</strong> ${o.w}`).join(' &middot; ')}</div>`;
  } else if(q.type === 'vocab-match'){
    body = `<div style="display:grid;gap:8px;margin-top:6px">
      ${q.pairs.map(p => `
        <div class="row">
          <div style="flex:1;font-size:.9rem">${p.word}</div>
          <select data-qid="${q.id}-${p.word}" style="width:120px;font-size:.85rem">
            <option value="">— pick —</option>
            ${q.options.map(o => {
              const l = o.match(/^([A-Z])/)[1];
              const sel = (ans[q.id+'-'+p.word]||'') === l ? 'selected' : '';
              return `<option value="${l}" ${sel}>${escHtml(o)}</option>`;
            }).join('')}
          </select>
        </div>
      `).join('')}
    </div>`;
  }
  return `
    <div class="q" data-q="${q.id}">
      <div><span class="q-num">${q.id}.</span><span class="q-text">${escHtml(q.q||'')}</span> ${marks}</div>
      ${body}
      <div class="feedback" id="fb-${q.id}" style="display:none"></div>
    </div>
  `;
}
function escHtml(s){ return String(s).replace(/[&<>"]/g,c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escAttr(s){ return escHtml(s); }

/* ---------- Live score widget ---------- */
function ensureLiveScore(){
  if(document.getElementById('liveScore')) return;
  const div = document.createElement('div');
  div.id = 'liveScore'; div.className = 'live-score';
  div.innerHTML = `
    <div class="ls-title">📊 Live score</div>
    <div class="ls-row"><span>Answered</span><strong id="lsAnswered">0/0</strong></div>
    <div class="ls-row"><span>Correct so far</span><strong id="lsCorrect">0/0</strong></div>
    <div class="ls-bar"><div class="ls-bar-fill" id="lsBar" style="width:0%"></div></div>
    <div class="ls-row" style="margin-top:6px;font-size:.78rem;color:var(--muted)"><span id="lsPct">0%</span><span id="lsGrade">—</span></div>
  `;
  document.body.appendChild(div);
}
function updateLiveScore(ex, skill){
  ensureLiveScore();
  const ans = getAns(ex.id, skill);
  let total = 0, answered = 0, correct = 0;
  const items = (skill === 'reading') ? ex.reading.texts.flatMap(t => t.questions)
              : ex.listening.passages.flatMap(p => p.questions);
  items.forEach(q => {
    const m = q.marks || 1; total += m;
    if(q.type === 'gapfill'){
      let any=0, gc=0;
      q.gaps.forEach(g => { if(ans[q.id+'-'+g.id]){ any=1; if(ans[q.id+'-'+g.id]===g.answer) gc++; } });
      if(any){ answered += 1; correct += gc; }
    } else if(q.type === 'vocab-match'){
      let any=0, gc=0;
      q.pairs.forEach(p => { if(ans[q.id+'-'+p.word]){ any=1; if(ans[q.id+'-'+p.word]===p.letter) gc++; } });
      if(any){ answered += 1; correct += gc; }
    } else {
      const v = ans[q.id];
      if(v && String(v).length > 0){
        answered += m;
        let ok = false;
        if(q.type === 'short' || q.type === 'vocab' || q.type === 'ref') ok = checkAnswer(q, v);
        else ok = (v === q.answer);
        if(ok) correct += m;
      }
    }
  });
  const ansEl = document.getElementById('lsAnswered');
  if(!ansEl) return;
  ansEl.textContent = `${answered}/${total}`;
  document.getElementById('lsCorrect').textContent = `${correct}/${total}`;
  const pct = total ? Math.round(correct/total*100) : 0;
  document.getElementById('lsBar').style.width = pct + '%';
  document.getElementById('lsPct').textContent = pct + '%';
  const grade = pct >= 80 ? '7' : pct >= 70 ? '6' : pct >= 60 ? '5' : pct >= 45 ? '4' : pct >= 30 ? '3' : '2';
  document.getElementById('lsGrade').textContent = 'IB ~' + grade;
}

function gradeReading(ex){
  const ans = getAns(ex.id, 'reading');
  let earned = 0, total = 0;
  ex.reading.texts.forEach(t => {
    t.questions.forEach(q => {
      const m = q.marks || 1; total += m;
      const fb = document.getElementById('fb-'+q.id);
      if(!fb) return;
      const inputs = document.querySelectorAll(`[data-qid="${q.id}"], [data-qid^="${q.id}-"]`);
      let correct = false; let detail = '';
      if(q.type === 'short' || q.type === 'vocab' || q.type === 'ref'){
        correct = checkAnswer(q, ans[q.id]||'');
        detail = correct ? '' : `Expected: <em>${escHtml(q.answer)}</em>`;
      } else if(q.type === 'mcq'){
        correct = (ans[q.id]||'') === q.answer;
        detail = correct ? '' : `Correct: <strong>${q.answer}</strong>`;
      } else if(q.type === 'tf'){
        correct = (ans[q.id]||'') === q.answer;
        detail = correct ? '' : `Correct: <strong>${q.answer}</strong>${q.justification ? '. Justification: <em>'+escHtml(q.justification)+'</em>' : ''}`;
      } else if(q.type === 'gapfill'){
        let gc = 0;
        q.gaps.forEach(g => {
          if((ans[q.id+'-'+g.id]||'') === g.answer) gc++;
        });
        earned += gc; correct = (gc === q.gaps.length);
        detail = `${gc}/${q.gaps.length} gaps correct. ${correct ? '' : 'Answers: '+q.gaps.map(g => g.id+'='+g.answer).join(', ')}`;
        fb.innerHTML = detail; fb.className = 'feedback ' + (correct ? 'ok' : 'err'); fb.style.display = 'block';
        return;
      } else if(q.type === 'vocab-match'){
        let gc = 0;
        q.pairs.forEach(p => {
          if((ans[q.id+'-'+p.word]||'') === p.letter) gc++;
        });
        earned += gc; correct = (gc === q.pairs.length);
        detail = `${gc}/${q.pairs.length} matches correct. ${correct ? '' : 'Answers: '+q.pairs.map(p => p.word+' = '+p.letter).join(', ')}`;
        fb.innerHTML = detail; fb.className = 'feedback ' + (correct ? 'ok' : 'err'); fb.style.display = 'block';
        return;
      }
      if(correct) earned += m;
      fb.innerHTML = correct ? '✓ Correct' : ('✗ ' + detail);
      fb.className = 'feedback ' + (correct ? 'ok' : 'err');
      fb.style.display = 'block';
    });
  });
  state.graded[ex.id+'-reading'] = true;
  recordAttempt(ex.id, 'reading', earned, total);
  saveState();
  showResult('reading', earned, total);
}

function showResult(skill, earned, total){
  const pct = Math.round(earned/total*100);
  const cls = pct >= 70 ? 'high' : pct >= 50 ? 'mid' : 'low';
  const grade = pct >= 80 ? '7' : pct >= 70 ? '6' : pct >= 60 ? '5' : pct >= 45 ? '4' : pct >= 30 ? '3' : '2';
  const el = document.getElementById('resultArea');
  if(el){
    el.innerHTML = `
      <div class="score-banner ${cls}">
        Your score: <strong>${earned} / ${total}</strong> (${pct}%) — Indicative IB grade: <strong>${grade}</strong>
      </div>
      <div style="font-size:.85rem;color:var(--muted)">Note: this is an automatic estimate based on objective answers only. Real IB grade boundaries vary each session and writing/speaking are graded by examiners.</div>
    `;
  }
}

let currentUtterance = null;
function stopTTS(){
  if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
  currentUtterance = null;
}
function speak(text, rate = 1.0, onend){
  if(!('speechSynthesis' in window)){
    alert('Text-to-speech is not supported in this browser. Please use Chrome, Edge or Safari.');
    return;
  }
  stopTTS();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate; u.pitch = 1.0;
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith('en-')) || voices[0];
  if(en) u.voice = en;
  if(onend) u.onend = onend;
  currentUtterance = u;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = () => {}; }

          <span class="chip">${ex.level==='HL'?'450–600 words':'250–400 words'}</span>
        </div>
        <p style="margin:6px 0;font-size:.95rem"><strong>Task:</strong> ${escHtml(p.prompt)}</p>
        <div style="margin-top:8px;font-size:.85rem"><strong>Conventions to follow:</strong> ${escHtml(p.conventions)}</div>
        <button class="show-answer" data-toggle-sample>Show example opening</button>
        <div class="answer-box">${escHtml(p.sample).replace(/\\n/g,'<br>')}</div>
      </div>
    `;
    setAns(ex.id, 'writing', '_chosenPrompt', i);
    area.querySelector('[data-toggle-sample]').addEventListener('click', e => {
      const box = e.target.nextElementSibling;
      box.classList.toggle('shown');
      e.target.textContent = box.classList.contains('shown') ? 'Hide example opening' : 'Show example opening';
    });
  }
  paintPrompt(ans._chosenPrompt|0);
  document.querySelectorAll('#promptTabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#promptTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); paintPrompt(parseInt(b.dataset.pidx));
  }));

  const essay = document.getElementById('essayArea');
  const wc = document.getElementById('wc');
  function updateWC(){
    const text = essay.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const target = ex.level === 'HL' ? [450,600] : [250,400];
    wc.textContent = `${words} words (target: ${target[0]}–${target[1]})`;
    wc.className = 'word-counter ' + (words >= target[0] && words <= target[1] ? 'ok' : (words > target[1] ? 'over' : ''));
    setAns(ex.id, 'writing', 'essay', essay.value);
  }
  essay.addEventListener('input', updateWC); updateWC();

  document.querySelectorAll('[data-rubric]').forEach(r => {
    r.addEventListener('input', () => {
      const i = r.dataset.rubric;
      document.getElementById('rubVal-'+i).textContent = r.value;
      setAns(ex.id, 'writing', 'c'+i, parseInt(r.value));
      updateRubTotal();
    });
  });
  function updateRubTotal(){
    const total = w.rubric.reduce((a,c,i) => a + (parseInt(ans['c'+i]) || 0), 0);
    document.getElementById('rubTotal').textContent = total;
  }
  updateRubTotal();

  document.getElementById('finishBtn').addEventListener('click', () => {
    state.graded[ex.id+'-writing'] = true;
    const total = w.rubric.reduce((a,c)=>a+c.max,0);
    const earned = w.rubric.reduce((a,c,i) => a + (parseInt(ans['c'+i]) || 0), 0);
    recordAttempt(ex.id, 'writing', earned, total);
    saveState();
    alert('✅ Writing attempt saved with your self-assessment! Consider asking your teacher for personalised feedback.');
    state.view = 'exam'; render();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if(confirm('Clear your essay and self-assessment?')){
      delete state.answers[ex.id]?.['writing'];
      delete state.graded[ex.id+'-writing'];
      saveState(); renderWriting(ex);
    }
  });
}

function bindSpeakingHandlers(ex){
  const sp = ex.speaking;
  const ans = getAns(ex.id, 'speaking');
  document.getElementById('backBtn').addEventListener('click', () => { stopTimer(); stopRec(); state.view = 'exam'; render(); });
  document.getElementById('startTimer').addEventListener('click', () => startTimer(state.timerSec || sp.timeLimit*60, () => alert('⏰ Preparation time finished!')));
  document.getElementById('stopTimer').addEventListener('click', stopTimer);

  const prep = document.getElementById('prepNotes');
  prep.addEventListener('input', () => setAns(ex.id, 'speaking', 'prepNotes', prep.value));

  const sampleBtn = document.getElementById('toggleSample');
  if(sampleBtn){
    sampleBtn.addEventListener('click', () => {
      const box = document.getElementById('sampleNotes');
      box.classList.toggle('shown');
      sampleBtn.textContent = box.classList.contains('shown') ? 'Hide example notes' : 'Show example notes';
    });
  }

  document.querySelectorAll('[data-fu]').forEach(t => t.addEventListener('input', () => {
    setAns(ex.id, 'speaking', 'fu'+t.dataset.fu, t.value);
  }));

  document.querySelectorAll('[data-rubric]').forEach(r => r.addEventListener('input', () => {
    const i = r.dataset.rubric;
    document.getElementById('rubVal-'+i).textContent = r.value;
    setAns(ex.id, 'speaking', 'c'+i, parseInt(r.value));
    updateRubTotal();
  }));
  function updateRubTotal(){
    const total = sp.rubric.reduce((a,c,i) => a + (parseInt(ans['c'+i]) || 0), 0);
    document.getElementById('rubTotal').textContent = total;
  }
  updateRubTotal();

  /* Recording with MediaRecorder */
  let mediaRec = null, chunks = [];
  const recBtn = document.getElementById('recBtn');
  const recStatus = document.getElementById('recStatus');
  const recTimeEl = document.getElementById('recTime');
  const recArea = document.getElementById('recArea');
  recBtn.addEventListener('click', async () => {
    if(!state.recording){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        chunks = [];
        mediaRec = new MediaRecorder(stream);
        mediaRec.ondataavailable = e => chunks.push(e.data);
        mediaRec.onstop = () => {
          const blob = new Blob(chunks, {type:'audio/webm'});
          const url = URL.createObjectURL(blob);
          const audio = document.getElementById('playback');
          audio.src = url; audio.style.display = 'block';
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRec.start();
        state.recording = true; state.recordSec = 0;
        recBtn.classList.add('recording'); recBtn.textContent = '■ Stop recording';
        recArea.classList.add('active'); recStatus.textContent = 'Recording…';
        state.recordTimer = setInterval(() => {
          state.recordSec++;
          recTimeEl.textContent = fmtTime(state.recordSec);
        }, 1000);
      } catch(err){
        alert('Microphone access denied or unavailable. You can still practise without recording.');
      }
    } else {
      stopRec();
    }
  });
  function stopRec(){
    if(state.recording && mediaRec){
      mediaRec.stop();
      state.recording = false;
      recBtn.classList.remove('recording'); recBtn.textContent = '● Start recording';
      recArea.classList.remove('active'); recStatus.textContent = `Recording finished (${fmtTime(state.recordSec)})`;
      clearInterval(state.recordTimer);
    }
  }

  document.getElementById('finishBtn').addEventListener('click', () => {
    state.graded[ex.id+'-speaking'] = true;
    const total = sp.rubric.reduce((a,c)=>a+c.max,0);
    const earned = sp.rubric.reduce((a,c,i) => a + (parseInt(ans['c'+i]) || 0), 0);
    recordAttempt(ex.id, 'speaking', earned, total);
    saveState();
    alert('✅ Speaking attempt saved! Listen to your recording, compare with the rubric, and mark yourself honestly.');
    state.view = 'exam'; render();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if(confirm('Clear all answers for this section?')){
      delete state.answers[ex.id]?.['speaking'];
      delete state.graded[ex.id+'-speaking'];
      saveState(); renderSpeaking(ex);
    }
  });
}

      const body = encodeURIComponent(
        `Hi,\n\nHere are my results from the IB English B Practice App:\n\n` +
        mine.map(a => `• ${a.examTitle} — ${a.skill}: ${a.earned}/${a.total} (${a.pct}%) — ${new Date(a.date).toLocaleDateString()}`).join('\n') +
        `\n\nMy share code (paste in the admin view):\n${code}\n\nBest,\n${state.user.name}\n${state.user.email}`
      );
      window.location.href = `mailto:${teacherEmail}?subject=${subject}&body=${body}`;
    });
    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(code).then(() => alert('✅ Share code copied!'));
    });
    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
      const rows = [['Date','Name','Email','Exam','Level','Skill','Earned','Total','Pct']];
      mine.forEach(a => rows.push([a.date, a.name, a.email, a.examTitle, a.level, a.skill, a.earned, a.total, a.pct]));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`results_${state.user.email}.csv`; a.click();
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());
  }
}

/* ============= ADMIN VIEW ============= */
function renderAdmin(){
  const all = JSON.parse(localStorage.getItem('ibAdminPool_v1') || '[]');

  // Compute aggregates
  const byStudent = {};
  all.forEach(a => {
    const key = a.email;
    if(!byStudent[key]) byStudent[key] = {name:a.name, email:a.email, attempts:[]};
    byStudent[key].attempts.push(a);
  });
  const studentList = Object.values(byStudent).sort((a,b) => a.name.localeCompare(b.name));

  app.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>🔐 Admin Dashboard</h2>
        <button class="ghost small" id="logoutAdmin">Log out</button>
      </div>
      <p style="color:var(--muted);font-size:.92rem">Welcome, teacher. Paste student share codes below to add them to the pool, or import a CSV. All data stays in your browser only.</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${studentList.length}</div><div class="stat-lbl">Students</div></div>
        <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-lbl">Total attempts</div></div>
        <div class="stat-card"><div class="stat-num">${all.length ? Math.round(all.reduce((a,b)=>a+b.pct,0)/all.length) : 0}%</div><div class="stat-lbl">Average score</div></div>
        <div class="stat-card"><div class="stat-num">${['reading','listening','writing','speaking'].filter(s => all.some(a => a.skill === s)).length}/4</div><div class="stat-lbl">Skills covered</div></div>
      </div>
    </div>

    <div class="card">
      <h3>➕ Add student results</h3>
      <p style="font-size:.88rem;color:var(--muted)">Paste a share code that a student sent you, then click "Add to pool".</p>
      <textarea id="codeInput" placeholder="Paste the share code here…" style="min-height:100px;font-family:ui-monospace,monospace;font-size:.78rem"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="addCodeBtn">Add to pool</button>
        <button class="ghost" id="clearPoolBtn">⚠️ Clear all student data</button>
        <button class="ghost" id="exportAllBtn">📊 Export all (CSV)</button>
      </div>
    </div>

    ${studentList.length === 0 ? '<div class="card"><p style="color:var(--muted)">No student data yet. Ask your students to copy their share code from "My Results" and paste it above.</p></div>' : `
      <div class="card">
        <h3>👥 Students (${studentList.length})</h3>
        <div style="overflow:auto"><table class="attempts-table">
          <thead><tr><th>Name</th><th>Email</th><th>Attempts</th><th>Avg %</th><th>Last activity</th><th></th></tr></thead>
          <tbody>
            ${studentList.map(s => {
              const avg = Math.round(s.attempts.reduce((a,b)=>a+b.pct,0)/s.attempts.length);
              const last = new Date(Math.max(...s.attempts.map(a => new Date(a.date)))).toLocaleString();
              return `<tr>
                <td><strong>${escHtml(s.name)}</strong></td>
                <td style="font-size:.82rem">${escHtml(s.email)}</td>
                <td>${s.attempts.length}</td>
                <td><strong>${avg}%</strong></td>
                <td style="font-size:.82rem">${last}</td>
                <td><button class="ghost small" data-detail="${escAttr(s.email)}">View</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>

      <div class="card">
        <h3>📊 All attempts (${all.length})</h3>
        <div style="overflow:auto"><table class="attempts-table">
          <thead><tr><th>Date</th><th>Student</th><th>Exam</th><th>Skill</th><th>%</th></tr></thead>
          <tbody>
            ${all.slice().reverse().slice(0,100).map(a => `
              <tr>
                <td style="font-size:.82rem">${new Date(a.date).toLocaleString()}</td>
                <td>${escHtml(a.name)} <span style="color:var(--muted);font-size:.78rem">(${escHtml(a.email)})</span></td>
                <td>${escHtml(a.examTitle)} <span class="chip ${a.level.toLowerCase()}">${a.level}</span></td>
                <td><span class="badge-skill skill-${a.skill}">${a.skill}</span></td>
                <td><strong>${a.pct}%</strong></td>
              </tr>
            `).join('')}
          </tbody>
        </table>${all.length > 100 ? '<p style="font-size:.82rem;color:var(--muted);margin-top:6px">Showing 100 most recent of '+all.length+' attempts. Export CSV to see all.</p>' : ''}</div>
      </div>
    `}

    <div id="detailArea"></div>
  `;

  document.getElementById('logoutAdmin').addEventListener('click', () => {
    state.user = null; state.isAdmin = false; saveState();
    state.view = 'home'; render();
  });
  document.getElementById('addCodeBtn').addEventListener('click', () => {
    const txt = document.getElementById('codeInput').value.trim();
    if(!txt) return alert('Please paste a share code.');
    try {
      const decoded = JSON.parse(decodeURIComponent(escape(atob(txt))));
      if(!decoded.u || !decoded.a) throw new Error('Invalid code');
      // Merge into pool, avoiding duplicates by date+email+skill+examId
      const pool = JSON.parse(localStorage.getItem('ibAdminPool_v1') || '[]');
      let added = 0;
      decoded.a.forEach(att => {
        const dup = pool.some(p => p.date === att.date && p.email === att.email && p.skill === att.skill && p.examId === att.examId);
        if(!dup){ pool.push(att); added++; }
      });
      localStorage.setItem('ibAdminPool_v1', JSON.stringify(pool));
      alert(`✅ Added ${added} new attempts from ${decoded.u.name} (${decoded.u.email}).`);
      renderAdmin();
    } catch(e){
      alert('❌ Invalid share code. Make sure you copied the whole thing.');
    }
  });
  document.getElementById('clearPoolBtn').addEventListener('click', () => {
    if(confirm('Delete ALL student data from this admin view? (Their devices won\'t be affected.)')){
      localStorage.removeItem('ibAdminPool_v1');
      renderAdmin();
    }
  });
  document.getElementById('exportAllBtn').addEventListener('click', () => {
    const rows = [['Date','Name','Email','Exam','Level','Skill','Earned','Total','Pct']];
    all.forEach(a => rows.push([a.date,a.name,a.email,a.examTitle,a.level,a.skill,a.earned,a.total,a.pct]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='all_student_results.csv'; a.click();
  });
  document.querySelectorAll('[data-detail]').forEach(b => b.addEventListener('click', () => {
    const email = b.dataset.detail;
    const stu = byStudent[email];
    document.getElementById('detailArea').innerHTML = `
      <div class="card">
        <h3>👤 ${escHtml(stu.name)} <span style="color:var(--muted);font-size:.85rem;font-weight:400">(${escHtml(stu.email)})</span></h3>
        <div style="overflow:auto"><table class="attempts-table">
          <thead><tr><th>Date</th><th>Exam</th><th>Skill</th><th>Score</th><th>%</th></tr></thead>
          <tbody>
            ${stu.attempts.slice().reverse().map(a => `
              <tr>
                <td style="font-size:.82rem">${new Date(a.date).toLocaleString()}</td>
                <td>${escHtml(a.examTitle)} <span class="chip ${a.level.toLowerCase()}">${a.level}</span></td>
                <td><span class="badge-skill skill-${a.skill}">${a.skill}</span></td>
                <td>${a.earned} / ${a.total}</td>
                <td><strong>${a.pct}%</strong></td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>
      </div>
    `;
    document.getElementById('detailArea').scrollIntoView({behavior:'smooth'});
  }));
}

/* ============= INIT ============= */
render();
</script>
</body>
</html>
